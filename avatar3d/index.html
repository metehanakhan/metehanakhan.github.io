<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Hohla Avatar</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; width: 100%; height: 100%; outline: none; opacity: 0; transform: scale(0.985); transition: opacity 0.45s ease, transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1); }
  canvas.hazir { opacity: 1; transform: none; }
  #yuk { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; font: 500 13px system-ui, sans-serif; color: rgba(237, 232, 242, 0.75); letter-spacing: 0.02em; text-align: center; transition: opacity 0.35s ease; }
  #yuk.gitti { opacity: 0; }
  #yuk i { margin-left: auto; margin-right: auto; }
  #yuk i { display: block; width: 120px; height: 3px; margin-top: 10px; border-radius: 3px; background: rgba(255, 255, 255, 0.12); overflow: hidden; }
  #yuk b { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #F2A65A, #E879A6); transition: width 0.2s; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/addons/" } }
</script>
</head>
<body>
<div id="yuk"><div>Avatar hazırlanıyor<i><b id="bar"></b></i></div></div>
<script type="module" src="./viewer.js"></script>
</body>
</html>
