<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saç Kataloğu</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0E0C12; color: #EDE8F2; font: 14px system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 2; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 12px 16px; background: rgba(14, 12, 18, 0.92); backdrop-filter: blur(8px); border-bottom: 1px solid rgba(255,255,255,0.08); }
  header h1 { font-size: 17px; margin: 0 12px 0 0; }
  button { font: 600 13px system-ui; padding: 7px 14px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.18); background: transparent; color: #EDE8F2; cursor: pointer; }
  button.on { background: #F2A65A; color: #1A1210; border-color: #F2A65A; }
  #ozet { margin-left: auto; color: rgba(237,232,242,0.7); }
  #durum { padding: 24px 16px; color: rgba(237,232,242,0.7); }
  #izgara { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; padding: 16px; }
  .kart { border-radius: 14px; overflow: hidden; background: #17141C; border: 2px solid rgba(255,255,255,0.08); }
  .kart.sec { border-color: #5BD08A; }
  .kart.ele { border-color: #E5534B; opacity: 0.72; }
  .kart img { display: block; width: 100%; }
  .kart .alt { padding: 8px 10px 10px; }
  .kart b { display: block; font-size: 13.5px; }
  .kart small { color: rgba(237,232,242,0.65); }
  .etiket { display: inline-block; margin-top: 5px; padding: 2px 8px; border-radius: 8px; font: 700 11.5px system-ui; }
  .sec .etiket { background: rgba(91,208,138,0.18); color: #7FE0A6; }
  .ele .etiket { background: rgba(229,83,75,0.18); color: #F08A84; }
  .bek .etiket { background: rgba(255,255,255,0.08); color: rgba(237,232,242,0.7); }
</style>
<script src="./_katalog_secim.js"></script>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/addons/" } }</script>
</head>
<body>
<header>
  <h1>Saç kataloğu</h1>
  <button id="b-kadin" class="on">Kadın</button>
  <button id="b-erkek">Erkek</button>
  <span id="ozet"></span>
</header>
<div id="durum">Katalog hazırlanıyor…</div>
<div id="izgara"></div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// Seçim: s = seçildi (uygulamaya ad), e = elendi (neden). Boş olanlar henüz değerlendirilmedi.
const SECIM = window.SECIM || { kadin: {}, erkek: {} };

const W = 300, H = 360;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, preserveDrawingBuffer: true });
renderer.setSize(W, H);
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.setClearColor(0x1b1820, 1);
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight('#FFF4E6', '#3A2C40', 1.2));
const key = new THREE.DirectionalLight('#FFF1DF', 2.2); key.position.set(-3, 5, 6); scene.add(key);
const back = new THREE.DirectionalLight('#FFF1DF', 1.4); back.position.set(2, 4, -6); scene.add(back);
const rim = new THREE.DirectionalLight('#FFB45E', 1.0); rim.position.set(4, 3, -4); scene.add(rim);
const cam = new THREE.PerspectiveCamera(28, W / H, 0.05, 20);
const loader = new GLTFLoader();
const cache = {};

async function yukle(b) {
  if (cache[b]) return cache[b];
  const [gltf, liste] = await Promise.all([loader.loadAsync(`_katalog_${b}.glb`), fetch(`_katalog_${b}.json`).then((r) => r.json())]);
  const root = gltf.scene;
  const sacs = {};
  root.traverse((o) => {
    if (!o.isMesh) return;
    const mats = [].concat(o.material);
    const ad = o.name + ' ' + (o.parent?.name || '');
    const sac = liste.find((x) => ad.includes(x.mesh));
    if (sac) {
      // Ana görüntüleyicideki gibi: opak çekirdek + yumuşak saydam kenar
      for (const m of mats) { m.alphaTest = 0.5; m.transparent = false; m.depthWrite = true; m.side = THREE.DoubleSide; m.color?.set('#6A4630'); }
      const soft = [].concat(o.material)[0].clone();
      soft.alphaTest = 0; soft.transparent = true; soft.depthWrite = false;
      const c = new THREE.Mesh(o.geometry, soft);
      c.position.copy(o.position); c.quaternion.copy(o.quaternion); c.scale.copy(o.scale);
      c.renderOrder = 1;
      o.userData.yumusak = c;
      (sacs[sac.mesh] ||= []).push(o);
    } else if (/high-poly|goz|eye/i.test(ad)) {
      for (const m of mats) { m.transparent = true; m.depthWrite = false; }
      o.renderOrder = 2;
    } else {
      for (const m of mats) { m.transparent = false; m.depthWrite = true; m.alphaTest = 0; }
    }
  });
  for (const list of Object.values(sacs)) for (const o of list) o.parent.add(o.userData.yumusak);
  const box = new THREE.Box3().setFromObject(root);
  return (cache[b] = { root, sacs, liste, top: box.max.y });
}

function cek(set, mesh, yaw) {
  for (const [k, list] of Object.entries(set.sacs)) for (const o of list) o.visible = o.userData.yumusak.visible = k === mesh;
  set.root.rotation.y = yaw;
  const yakin = new URLSearchParams(location.search).has('yakin');
  const y = set.top - (yakin ? 0.12 : 0.3);
  cam.position.set(0, y + (yakin ? 0.03 : 0.05), yakin ? 0.62 : 1.45);
  cam.lookAt(0, y - 0.01, 0);
  renderer.render(scene, cam);
  return renderer.domElement.toDataURL('image/webp', 0.82);
}

let aktif = 'kadin';
async function goster(b) {
  aktif = b;
  document.getElementById('b-kadin').classList.toggle('on', b === 'kadin');
  document.getElementById('b-erkek').classList.toggle('on', b === 'erkek');
  const iz = document.getElementById('izgara');
  const durum = document.getElementById('durum');
  iz.innerHTML = '';
  durum.style.display = 'block';
  durum.textContent = 'Katalog yükleniyor (büyük dosya, birkaç saniye)…';
  const set = await yukle(b);
  for (const s2 of Object.values(cache)) if (s2.root.parent) scene.remove(s2.root);
  scene.add(set.root);
  durum.style.display = 'none';
  const sec = SECIM[b] || {};
  let ns = 0, ne = 0;
  const sira = (x) => (sec[x.ad]?.s ? 0 : sec[x.ad]?.e ? 2 : 1);
  for (const s of [...set.liste].sort((a, b) => sira(a) - sira(b))) {
    const on = cek(set, s.mesh, -0.45);
    const ar = cek(set, s.mesh, Math.PI - 0.5);
    const c = document.createElement('canvas');
    c.width = W * 2; c.height = H;
    const g = c.getContext('2d');
    const i1 = new Image(); i1.src = on; await i1.decode();
    const i2 = new Image(); i2.src = ar; await i2.decode();
    g.drawImage(i1, 0, 0); g.drawImage(i2, W, 0);
    const k = sec[s.ad];
    const durumSinif = k?.s ? 'sec' : k?.e ? 'ele' : 'bek';
    if (k?.s) ns++; if (k?.e) ne++;
    const d = document.createElement('div');
    d.className = 'kart ' + durumSinif;
    d.innerHTML = `<img alt=""><div class="alt"><b></b><small></small><br><span class="etiket"></span></div>`;
    d.querySelector('img').src = c.toDataURL('image/webp', 0.85);
    d.querySelector('b').textContent = k?.s ? `${k.s}` : s.ad;
    d.querySelector('small').textContent = `${s.ad} · ${s.kose.toLocaleString('tr-TR')} köşe`;
    d.querySelector('.etiket').textContent = k?.s ? 'Seçildi' + (k.not ? ' · ' + k.not : '') : k?.e ? 'Elendi · ' + k.e : 'Değerlendiriliyor';
    iz.appendChild(d);
  }
  document.getElementById('ozet').textContent = `${set.liste.length} saç · ${ns} seçildi · ${ne} elendi`;
}
document.getElementById('b-kadin').onclick = () => goster('kadin');
document.getElementById('b-erkek').onclick = () => goster('erkek');
goster(new URLSearchParams(location.search).get('b') || 'kadin');
</script>
</body>
</html>
